<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <!-- Cloud Body -->
  <path d="M60 148 C40 148 24 132 24 112 C24 95 36 80 52 76 C55 52 75 34 100 34 C125 34 145 52 148 76 C164 80 176 95 176 112 C176 132 160 148 140 148 Z" fill="#FFFFFF" stroke="#D7C7F2" stroke-width="3" stroke-linejoin="round"/>

  <!-- Blush -->
  <circle cx="56" cy="116" r="8" fill="#E8C5D0" opacity="0.8"/>
  <circle cx="144" cy="116" r="8" fill="#E8C5D0" opacity="0.8"/>

  <!-- Purple Goggles -->
  <g id="goggles">
    <rect x="52" y="78" width="38" height="28" rx="10" fill="#C7B8EA" stroke="#9883C7" stroke-width="3"/>
    <rect x="110" y="78" width="38" height="28" rx="10" fill="#C7B8EA" stroke="#9883C7" stroke-width="3"/>
    <path d="M90 92 L110 92" stroke="#9883C7" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="66" cy="88" rx="6" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="124" cy="88" rx="6" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <!-- Gentle happy eye curves -->
    <path d="M68 95 Q74 91 80 95" stroke="#29272E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M126 95 Q132 91 138 95" stroke="#29272E" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Sweet Smile -->
  <path d="M93 115 Q100 122 107 115" stroke="#29272E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Lab Coat -->
  <g id="lab-coat">
    <path d="M72 135 L64 165 C64 167 136 167 136 165 L128 135 Z" fill="#F8F6FD" stroke="#D7C7F2" stroke-width="2.5"/>
    <path d="M85 135 L100 152 L115 135" stroke="#9883C7" stroke-width="2" fill="none"/>
    <circle cx="100" cy="158" r="2" fill="#9883C7"/>
    <!-- STRESS LAB Badge -->
    <rect x="74" y="142" width="16" height="10" rx="3" fill="#C7B8EA" stroke="#9883C7" stroke-width="1"/>
    <line x1="77" y1="147" x2="87" y2="147" stroke="#29272E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Big Warm Heart (Item: Contact) -->
  <g id="heart" transform="translate(0, -6)">
    <path d="M100 148 C95 138 82 134 76 142 C68 152 78 164 100 178 C122 164 132 152 124 142 C118 134 105 138 100 148 Z" fill="#E8C5D0" stroke="#9883C7" stroke-width="2.5"/>
    <ellipse cx="88" cy="146" rx="4" ry="2" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Hands holding heart gently -->
  <circle cx="78" cy="154" r="6" fill="#FFFFFF" stroke="#D7C7F2" stroke-width="2"/>
  <circle cx="122" cy="154" r="6" fill="#FFFFFF" stroke="#D7C7F2" stroke-width="2"/>
</svg>
