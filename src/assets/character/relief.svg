<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <!-- Cloud Body -->
  <path d="M60 148 C40 148 24 132 24 112 C24 95 36 80 52 76 C55 52 75 34 100 34 C125 34 145 52 148 76 C164 80 176 95 176 112 C176 132 160 148 140 148 Z" fill="#FFFFFF" stroke="#D7C7F2" stroke-width="3" stroke-linejoin="round"/>

  <!-- Blush -->
  <circle cx="56" cy="116" r="8" fill="#E8C5D0" opacity="0.7"/>
  <circle cx="144" cy="116" r="8" fill="#E8C5D0" opacity="0.7"/>

  <!-- Purple Goggles -->
  <g id="goggles">
    <rect x="52" y="78" width="38" height="28" rx="10" fill="#C7B8EA" stroke="#9883C7" stroke-width="3"/>
    <rect x="110" y="78" width="38" height="28" rx="10" fill="#C7B8EA" stroke="#9883C7" stroke-width="3"/>
    <path d="M90 92 L110 92" stroke="#9883C7" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="66" cy="88" rx="6" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <ellipse cx="124" cy="88" rx="6" ry="4" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="74" cy="94" r="3.5" fill="#29272E"/>
    <circle cx="132" cy="94" r="3.5" fill="#29272E"/>
  </g>

  <!-- Smile -->
  <path d="M93 115 Q100 120 107 115" stroke="#29272E" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Lab Coat -->
  <g id="lab-coat">
    <path d="M72 135 L64 165 C64 167 136 167 136 165 L128 135 Z" fill="#F8F6FD" stroke="#D7C7F2" stroke-width="2.5"/>
    <path d="M85 135 L100 152 L115 135" stroke="#9883C7" stroke-width="2" fill="none"/>
    <circle cx="100" cy="158" r="2" fill="#9883C7"/>
    <!-- STRESS LAB Badge -->
    <rect x="74" y="142" width="16" height="10" rx="3" fill="#C7B8EA" stroke="#9883C7" stroke-width="1"/>
    <line x1="77" y1="147" x2="87" y2="147" stroke="#29272E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Flask (Item: Relief) -->
  <g id="flask" transform="translate(18, -4)">
    <!-- Flask Body -->
    <path d="M125 110 L125 120 L112 144 C110 148 113 154 119 154 L141 154 C147 154 150 148 148 144 L135 120 L135 110 Z" fill="#FFFFFF" stroke="#9883C7" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="122" y="107" width="16" height="4" rx="2" fill="#C7B8EA" stroke="#9883C7" stroke-width="1.5"/>
    <!-- Purple Liquid -->
    <path d="M116 137 L144 137 L142 147 C141 151 138 152 135 152 L125 152 C122 152 119 151 118 147 Z" fill="#C7B8EA" opacity="0.8"/>
    <!-- Bubbles -->
    <circle cx="130" cy="142" r="2" fill="#FFFFFF"/>
    <circle cx="136" cy="132" r="1.5" fill="#C7B8EA"/>
    <circle cx="130" cy="124" r="1.2" fill="#C7B8EA"/>
  </g>

  <!-- Hand holding flask -->
  <circle cx="138" cy="132" r="6.5" fill="#FFFFFF" stroke="#D7C7F2" stroke-width="2"/>
</svg>
